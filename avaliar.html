<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Avaliar - Rateat</title>
</head>

<body>

<header>
    <a href="inicio.html" class="logo">
        <img src="logo.png" alt="Logo RateAt">
        <span>Rateat</span>
    </a>
    <nav>
        <a href="inicio.html">Início</a>
        <a href="restaurantes.html">Restaurantes</a>
        <a href="avaliar.html" class="ativo">Avaliar</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Entrar</a>
    </nav>
</header>

<main>

    <h1>Avaliar Restaurante</h1>

    <!-- TODO: quando ligar ao PHP, trocar action para "avaliar/salvaravaliacao.php" -->
    <form action="avaliar.html" method="post">

        <label for="nome">Nome do Restaurante</label><br>
        <!-- TODO: substituir o input abaixo por um <select> que lista os restaurantes
             buscados do banco com PHP:
             while($r = ...) { echo "<option value='$r[nome]'>$r[nome]</option>"; } -->
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="nota">Nota (1 a 5)</label><br>
        <select id="nota" name="nota" required>
            <option value="">Escolha</option>
            <option value="5">5 - Excelente</option>
            <option value="4">4 - Muito bom</option>
            <option value="3">3 - Bom</option>
            <option value="2">2 - Regular</option>
            <option value="1">1 - Ruim</option>
        </select><br><br>

        <label for="comentario">Comentário</label><br>
        <textarea id="comentario" name="comentario" rows="4" cols="40"></textarea><br><br>

        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <a href="restaurantes.html">Voltar</a>

    </form>

</main>

<footer>
    <p>2026 - Rateat</p>
</footer>

</body>
</html>
