<main>
    <h1>Avaliar Restaurante</h1>
    <form action="/avaliar.html" method="post">
        <label for="nome">Nome do Restaurante:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="nota">Nota (0 a 5):</label>
        <input type="number" id="nota" name="nota" min="0" max="5" step="0.1" required><br><br>

        <label for="comentario">Comentário:</label><br>
        <textarea id="comentario" name="comentario" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Enviar Avaliação">
        <div style="margin-top: 10px;">
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
            <button <a href="/restaurantes.html" class="botao-voltar">Voltar</button></a>
    </form>
