<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro - Rateat</title>
</head>

<body>

<header>
    <a href="inicio.html" class="logo">
        <img src="logo.png" alt="Logo RateAt">
        <span>Rateat</span>
    </a>
    <nav>
        <a href="inicio.html">Início</a>
        <a href="restaurantes.html">Restaurantes</a>
        <a href="avaliar.html">Avaliar</a>
        <a href="cadastro.html" class="ativo">Cadastro</a>
        <a href="login.html">Entrar</a>
    </nav>
</header>

<main>

    <h1>Criar Conta</h1>

    <!-- TODO: quando ligar ao PHP, trocar action para "usuario/salvarusuario.php" -->
    <form action="cadastro.html" method="post">

        <label for="nome">Nome</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha</label><br>
        <input type="password" id="senha" name="senha" required><br><br>

        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>

    </form>

    <br>

    <p>Já tem conta? <a href="login.html">Entrar</a></p>

</main>

<footer>
    <p>2026 - Rateat</p>
</footer>

</body>
</html>
